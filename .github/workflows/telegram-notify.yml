name: 전력일보 갱신 알림 (텔레그램)

on:
  push:
    branches: [ main ]
    paths:
      - 'daily_data.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 최신 일자 데이터 추출 및 메시지 생성
        id: build_message
        run: |
          python3 << 'PYEOF'
          import json, os

          with open('daily_data.json', encoding='utf-8') as f:
              data = json.load(f)

          days = sorted(data['days'], key=lambda d: d['date'])
          last = days[-1]

          def fmt(n, d=0):
              return f"{n:,.{d}f}" if n is not None else "-"

          def target_delta_line(label, cur, target, unit="", decimals=2):
              if cur is None:
                  return f"· {label}: -"
              if not target:
                  return f"· {label}: {fmt(cur, decimals)}{unit}"
              diff = cur - target
              pct = diff / target * 100
              if diff > 0:
                  arrow = "🔺"
              elif diff < 0:
                  arrow = "▼"
              else:
                  arrow = "➖"
              return f"· {label}: {fmt(cur, decimals)}{unit} ({arrow} {abs(pct):.1f}% 목표대비)"

          lines = []
          lines.append(f"⚡ *단양공장 전력일보 갱신 알림*")
          lines.append(f"📅 {last['date']}")
          lines.append("")
          lines.append("설비군별 원단위 (kWh/t, 기준 상이)")
          group_labels = {"QR": "Crusher(원료수급)", "R": "R/M(원료분쇄)", "K": "K/L(소성)", "Co": "Co/M(석탄분쇄)", "C": "C/M(시멘트분쇄)"}
          for k, label in group_labels.items():
              cur_v = last['groups'].get(k, {}).get('원단위')
              target_v = last['groups'].get(k, {}).get('목표_원단위')
              lines.append(target_delta_line(label, cur_v, target_v, " kWh/t"))
          lines.append("")
          unit_values = [last['groups'].get(k, {}).get('원단위') for k in group_labels]
          unit_sum = sum(v for v in unit_values if v is not None) if any(v is not None for v in unit_values) else None
          lines.append(f"· 전력원단위: {fmt(unit_sum, 2)} kWh/t")
          lines.append(target_delta_line("합계(Crusher+R+K+Co+C)", last.get('total_usage_incl_crusher'), last.get('total_target_usage_incl_crusher'), " kWh", 0))
          lines.append(f"· 전력비용: {fmt(last.get('total_cost'), 0)} 원")
          lines.append("")
          lines.append("🔗 https://mr1kwg-wang1.github.io/daily-power-dashboard/")
          lines.append("")

          message = "\n".join(lines)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write("message<<EOF\n")
              out.write(message)
              out.write("\nEOF\n")
          PYEOF

      - name: 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.build_message.outputs.message }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${MESSAGE}"
